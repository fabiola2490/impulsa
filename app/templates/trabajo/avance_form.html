{% extends "base.html" %}{% block title %}Registrar avance | Impulsa{% endblock %}
{% block contenido %}<section class="admin-seccion"><div class="contenedor formulario-contenedor"><a class="volver" href="{{ url_for('trabajo.actividad', actividad_id=actividad.id) }}">← Volver a la actividad</a><div class="formulario-cabecera"><span class="acceso-icono cyan">📈</span><div><h1>Registra tu avance</h1><p>{{ actividad.titulo }} · Sesión de {{ sesion.duracion_segundos|duracion_legible }}</p></div></div>
<form class="formulario-usuario" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="campos-grid"><label class="campo-completo">¿Qué lograste en esta sesión?<textarea name="descripcion" rows="4" required placeholder="Describe concretamente el trabajo realizado">{{ request.form.get('descripcion','') }}</textarea></label><label>Porcentaje total de la actividad<input id="porcentaje-avance" name="porcentaje_declarado" type="number" min="0" max="100" step="0.01" required value="{{ request.form.get('porcentaje_declarado','') }}" placeholder="Ej. 35"></label><label>Dificultades encontradas<input name="dificultades" value="{{ request.form.get('dificultades','') }}" placeholder="Ej. Error en la conexión"></label><label class="campo-completo">¿Cuál será el siguiente paso?<textarea name="siguiente_paso" rows="3" placeholder="Describe qué harás en la próxima sesión">{{ request.form.get('siguiente_paso','') }}</textarea></label></div><div class="acciones-formulario"><a href="{{ url_for('trabajo.actividad', actividad_id=actividad.id) }}">Registrar después</a><button class="boton boton-primario" type="submit">Guardar avance</button></div></form>
</div></section>{% endblock %}
