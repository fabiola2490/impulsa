{% extends "base.html" %}{% block title %}Registrar uso de IA | Impulsa{% endblock %}
{% block contenido %}<section class="admin-seccion"><div class="contenedor formulario-contenedor"><a class="volver" href="{{ url_for('ia.lista') }}">← Volver al historial</a><div class="formulario-cabecera"><span class="acceso-icono violeta">✨</span><div><h1>{{ 'Editar interacción' if interaccion else 'Registrar uso de IA' }}</h1><p>Explica qué solicitaste, qué recibiste y cómo validaste la respuesta.</p></div></div>
<form class="formulario-usuario formulario-ia" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="campos-grid">
<label class="campo-completo">Actividad<select name="actividad_id" required><option value="">Selecciona una actividad</option>{% for actividad in actividades %}{% set seleccionada = request.form.get('actividad_id', interaccion.actividad_id if interaccion else actividad_preseleccionada) %}<option value="{{ actividad.id }}" {% if seleccionada|string == actividad.id|string %}selected{% endif %}>{{ actividad.titulo }}</option>{% endfor %}</select></label>
<label>Herramienta o proveedor<input name="proveedor" maxlength="40" value="{{ request.form.get('proveedor', interaccion.proveedor if interaccion and interaccion.proveedor else request.args.get('proveedor','')) }}" placeholder="Ej. ChatGPT, Gemini, Copilot"></label><label>Modelo <small>(opcional)</small><input name="modelo" maxlength="80" value="{{ request.form.get('modelo', interaccion.modelo if interaccion and interaccion.modelo else '') }}" placeholder="Si no conoces el modelo, déjalo vacío"></label>
<label>Tipo de ayuda<select name="tipo_ayuda" required><option value="">Selecciona una opción</option>{% for valor,texto in tipos.items() %}<option value="{{ valor }}" {% if request.form.get('tipo_ayuda', interaccion.tipo_ayuda if interaccion else '') == valor %}selected{% endif %}>{{ texto }}</option>{% endfor %}</select></label><label>Resultado de la interacción<select name="estado" required>{% for valor,texto in estados.items() %}<option value="{{ valor }}" {% if request.form.get('estado', interaccion.estado if interaccion else 'pendiente') == valor %}selected{% endif %}>{{ texto }}</option>{% endfor %}</select></label>
<label class="campo-completo">Prompt o consulta enviada<textarea name="consulta" rows="5" required placeholder="Copia exactamente lo que preguntaste a la IA">{{ request.form.get('consulta', interaccion.consulta if interaccion else '') }}</textarea></label><label class="campo-completo">Código enviado <small>(opcional)</small><textarea class="campo-codigo" name="codigo_enviado" rows="5" placeholder="Código que compartiste con la herramienta">{{ request.form.get('codigo_enviado', interaccion.codigo_enviado if interaccion and interaccion.codigo_enviado else '') }}</textarea></label><label class="campo-completo">Respuesta obtenida <small>(opcional)</small><textarea name="respuesta" rows="5" placeholder="Resume o copia la respuesta recibida">{{ request.form.get('respuesta', interaccion.respuesta if interaccion and interaccion.respuesta else '') }}</textarea></label><label class="campo-completo">¿Qué aplicaste o modificaste tú?<textarea class="campo-codigo" name="codigo_modificado" rows="5" placeholder="Explica los cambios propios o pega el resultado modificado">{{ request.form.get('codigo_modificado', interaccion.codigo_modificado if interaccion and interaccion.codigo_modificado else '') }}</textarea></label><label class="campo-completo">¿Cómo verificaste la respuesta?<textarea name="verificacion" rows="4" placeholder="Ej. Ejecuté pruebas, consulté documentación oficial y corregí un error">{{ request.form.get('verificacion', interaccion.error_tecnico if interaccion and interaccion.error_tecnico else '') }}</textarea></label><label>Tiempo de resolución (minutos)<input name="tiempo_resolucion_minutos" type="number" min="0" max="1440" step="0.1" value="{{ request.form.get('tiempo_resolucion_minutos', ((interaccion.tiempo_resolucion_segundos or 0) / 60) if interaccion else '') }}" placeholder="Ej. 15"></label>
</div><div class="acciones-formulario"><a href="{{ url_for('ia.lista') }}">Cancelar</a><button class="boton boton-primario" type="submit">{{ 'Guardar cambios' if interaccion else 'Guardar registro de IA' }}</button></div></form>
</div></section>{% endblock %}
