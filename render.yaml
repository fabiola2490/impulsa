services:
  - type: web
    name: impulsa
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: impulsa-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: UMG_ALLOWED_EMAIL_DOMAINS
        value: miumg.edu.gt,umg.edu.gt,mariano.edu.gt
      - key: MIN_SESIONES_TRABAJO
        value: "4"
      - key: REGISTRATION_COURSE_CODE
        value: 2490-049-A

databases:
  - name: impulsa-db
    plan: free
